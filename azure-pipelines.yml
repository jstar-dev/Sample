name: Java Maven CI\n\ntrigger:\n  branches:\n    include:\n      - main\n\npool:\n  vmImage: 'ubuntu-latest'\n\nsteps:\n- task: MavenAuthenticate@0\n\n- task: MavenPomFile@0\n  inputs:\n    mavenPomFile: 'pom.xml'\n\n- task: Maven@3\n  inputs:\n    mavenPomFile: 'pom.xml'\n    goals: 'install'\n    options: '-DskipTests=false'\n\n- task: Maven@3\n  inputs:\n    mavenPomFile: 'pom.xml'\n    goals: 'test'"
